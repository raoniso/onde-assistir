# Onde.Assistir — robô de dados
# Roda o pipeline (atualizar_dados.py) de hora em hora e também:
#   - na hora, quando o pipeline, o template do app (onde-assistir.html) ou este
#     arquivo mudam;
#   - manualmente, pelo botão "Run workflow" na aba Actions.
# Publica eventos.json, index.html, memoria_guias.json e diagnostico.json no
# próprio repositório, de onde o GitHub Pages serve o site. Se uma fonte fica
# horas sem dados, o último passo falha de propósito (alarme por e-mail).

name: Atualizar jogos

on:
  schedule:
    # O GitHub não cumpre agendamento à risca neste repositório: com "0 */4"
    # rodavam ~3 das 6 execuções diárias, com 2 a 4 horas de atraso; com
    # "23 */3", 2 das 7 primeiras. Por isso o pedido é de hora em hora (fora da
    # hora cheia, que é o pior momento): perder alguns disparos deixa de importar.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "atualizar_dados.py"
      - "onde-assistir.html"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write

# Uma execução por vez: push e agendamento nunca disputam o mesmo commit.
concurrency:
  group: atualizar-jogos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5          # v5/v6 rodam em Node 24 (as anteriores, em Node 20, foram descontinuadas)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar e cruzar fontes
        id: coleta
        run: python atualizar_dados.py

      - name: Publicar dados novos
        run: |
          git config user.name "onde-assistir-bot"
          git config user.email "bot@users.noreply.github.com"
          git add eventos.json index.html diagnostico.json
          # a memória dos guias só existe se o pipeline a gravou; sem ela, publica o resto
          if [ -f memoria_guias.json ]; then git add memoria_guias.json; fi
          git diff --cached --quiet && echo "Sem mudanças." || {
            git commit -m "Atualiza jogos — $(date -u -d '-3 hours' +'%d/%m %H:%M') BRT"
            git pull --rebase --autostash origin main
            git push
          }

      # Publica primeiro, avisa depois: o alarme nunca segura os dados que deram certo.
      # O pipeline pede o alarme quando o guia de TV fica 2 horas sem jogos (ou a ESPN
      # inteira fora), ou quando o 2º guia fica um dia sem jogos.
      # Job com falha = e-mail do GitHub para o dono do repositório.
      # Commit cuja mensagem COMEÇA por [teste-alarme] dispara um aviso de teste.
      - name: "ALARME: fonte sem dados (avise o Claude)"
        if: ${{ steps.coleta.outputs.alerta != '' || startsWith(github.event.head_commit.message, '[teste-alarme]') }}
        env:
          ALERTA: ${{ steps.coleta.outputs.alerta }}
        run: |
          echo "::error title=Onde.Assistir::${ALERTA:-Teste do alarme. Está tudo funcionando: esta falha foi provocada só para conferir se o aviso chega por e-mail.}"
          exit 1

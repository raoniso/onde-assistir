<!DOCTYPE html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D13">
<meta name="color-scheme" content="dark">
<meta name="versao-da-tela" content="2026-11-18-a">
<title>Onde Assistir — Guia de Transmissões</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Identidade: fundo escuro, hora em âmbar, verde = "dá para assistir".
     Toda família de fonte passa pelas duas variáveis abaixo, que sempre
     terminam numa fonte do sistema (a página não muda de cara se o Google
     Fonts não carregar). */
  :root{
    --fundo:#0A0D13; --faixa:#111826; --linha:#1F2838; --linha2:#2B3549;
    --texto:#EAEFF7; --texto2:#A8B2C4; --texto3:#8791A5;
    --hora:#F7A823; --verde:#2FD380; --verde-fundo:#11301F; --verde-texto:#7CF0B5;
    --vivo:#FF6B79;
    --corpo:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --placar:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{background:var(--fundo); color:var(--texto); font:400 15px/1.4 var(--corpo); padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; position:relative}
  input{font:inherit; -webkit-appearance:none; appearance:none}
  a{color:inherit; text-decoration:none}
  [hidden]{display:none !important}
  :focus-visible{outline:2px solid var(--verde); outline-offset:2px}
  .miolo{max-width:600px; margin-left:auto; margin-right:auto}
  .so-leitor{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}

  /* ---------- topo fixo: marca, dias, filtros rápidos ---------- */
  .topo{position:sticky; top:0; z-index:20; background:rgba(10,13,19,.94); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
        border-bottom:1px solid var(--linha); padding-top:env(safe-area-inset-top)}
  .marca{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 4px 0 14px}
  .nome{min-width:0}
  .marca h1{margin:0; font:800 23px/1 var(--placar); letter-spacing:.4px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .marca h1 b{color:var(--verde); font-weight:800}
  .frescor{margin:2px 0 0; min-height:15px; color:var(--texto3); font-size:12px; line-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}      /* de quando são os dados */
  .frescor.velho{color:var(--hora)}
  .botoes{display:flex; flex:0 0 auto}
  @media (max-width:359px){ .marca h1{font-size:20px} }
  .icone{flex:0 0 auto; width:44px; height:44px; display:grid; place-items:center; color:var(--texto2); border-radius:12px}
  .icone.girando svg{animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .rolagem{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:4px 14px}
  .rolagem::-webkit-scrollbar{display:none}
  .semana{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; padding:4px 14px}      /* os 7 dias sempre à vista */
  .dia{min-width:0; height:46px; border-radius:12px; border:1px solid var(--linha); color:var(--texto2);
       display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:600; font-size:13px; line-height:1.15}
  .dia small{font-weight:500; font-size:12px; color:var(--texto3)}
  .dia.sel{background:var(--verde); border-color:var(--verde); color:#06140C}
  .dia.sel small{color:#0B3A22}
  .dia i{width:7px; height:7px; border-radius:50%; background:var(--hora); position:absolute; top:4px; right:5px}      /* "Meu time" joga neste dia */
  .dia.sel i{background:#06140C}
  .icone.tem{color:var(--hora)}
  .icone.tem path{fill:currentColor}
  .barra{display:flex; align-items:center; padding:6px 14px 10px 0}
  .barra .rolagem{flex:1 1 auto; padding:3px 18px 3px 14px; margin:-3px 0; scroll-padding:0 30px 0 14px; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
  .rapido{flex:0 0 auto; height:38px; padding:0 14px; border-radius:19px; border:1px solid var(--linha); color:var(--texto2); font-weight:500; font-size:14px;
          display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .rapido::after{content:''; position:absolute; inset:-4px 0}                 /* alvo de toque de 44 px (parte de dentro da borda) */
  .rapido.sel{background:var(--verde-fundo); border-color:var(--verde); color:var(--verde-texto); font-weight:600}
  .rapido.filtros{color:var(--texto); border-color:#33405A}
  .rapido .n{background:var(--verde); color:#06140C; border-radius:9px; min-width:18px; height:18px; font-size:12px; font-weight:700; display:grid; place-items:center; padding:0 5px}
  .busca{display:flex; align-items:center; gap:4px; padding:6px 6px 10px 14px}
  .busca input{flex:1 1 auto; min-width:0; height:44px; border-radius:12px; border:1px solid var(--linha2); background:var(--fundo); color:var(--texto); padding:0 14px; font-size:16px}
  .busca input::placeholder, .campo::placeholder{color:var(--texto3)}
  .texto{min-height:44px; padding:0 10px; color:var(--verde-texto); font-weight:600; font-size:14px}
  .fuso{margin-top:10px; margin-bottom:-4px; padding:0 14px; color:var(--texto2); font-size:13px}

  /* ---------- lista ---------- */
  main{padding:0 10px}
  .secao{margin:14px 4px 6px; font:600 13.5px/1.4 var(--corpo); color:var(--texto2); display:flex; align-items:center; gap:8px}
  .secao .pulso{width:8px; height:8px; border-radius:50%; background:var(--vivo)}
  .grupo{list-style:none; margin:0; padding:0; background:var(--faixa); border:1px solid var(--linha); border-radius:14px; overflow:hidden}
  .jogo{display:grid; grid-template-columns:62px minmax(0,1fr); column-gap:6px; padding:11px 12px; border-top:1px solid var(--linha)}
  .jogo:first-child{border-top:0}
  .hora{font:700 27px/1 var(--placar); color:var(--hora); letter-spacing:.3px; padding-top:1px; min-width:0}
  .hora time{display:block}
  .hora .st{display:block; margin-top:5px; font:600 12px/1.15 var(--corpo); letter-spacing:0; color:var(--texto3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hora .st.vivo{color:var(--vivo)}
  .jogo.fim .hora{color:var(--texto3)}
  .times{font-weight:600; font-size:16px; line-height:1.25; overflow-wrap:anywhere}
  .times .x{color:var(--texto3); font-weight:400; padding:0 1px}
  .times .pl{font:700 21px/1 var(--placar); letter-spacing:.3px; font-variant-numeric:tabular-nums}
  .jogo.fim .pl{color:var(--texto2)}
  .times .fav{color:var(--hora); margin-right:4px}
  .linha2{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:5px}
  .liga{color:var(--texto2); font-size:13px; flex:1 1 0; min-width:42%}        /* a liga cede espaço (quebrando em 2 linhas) antes de empurrar os canais para baixo */
  .liga span{color:var(--texto3)}
  .canais{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-left:auto}
  .canal{position:relative; min-height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--linha2); color:var(--texto2); font-weight:600; font-size:13px;
         display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  a.canal::after{content:''; position:absolute; inset:-5px 0}                  /* alvo de toque de 44 px */
  .canal.gratis{background:var(--verde-fundo); border-color:transparent; color:var(--verde-texto)}      /* verde = passa de graça */
  .canal small{font-weight:500; font-size:12px; opacity:.85}
  .aconfirmar{color:var(--texto3); font-size:13px; white-space:nowrap; align-self:center}
  .agora{display:flex; align-items:center; gap:10px; margin:12px 4px 2px; color:var(--vivo); font:600 12.5px/1 var(--corpo)}
  .agora::before,.agora::after{content:''; height:1px; background:var(--vivo); opacity:.55}
  .agora::before{width:14px} .agora::after{flex:1}
  .nada{margin:14px 4px 6px; color:var(--texto2); font-size:13.5px}
  .ligados{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:12px 4px 0; font-size:13px; color:var(--texto2)}
  .etq{min-height:36px; padding:0 10px 0 12px; border-radius:18px; background:var(--verde-fundo); color:var(--verde-texto); font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:8px}
  .etq::after{content:''; position:absolute; inset:-4px 0}                     /* alvo de toque de 44 px */
  .etq b{font-weight:400; font-size:17px; line-height:1; opacity:.85}
  .ligados .texto, .nada .texto{min-height:36px; padding:0 6px}
  .incluir{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:12px 4px 0}      /* feminino, base e divisões inferiores: fora da lista até ligar */
  .inc{min-height:32px; padding:0 11px; border-radius:16px; border:1px dashed #3A465E; color:var(--texto2); font-weight:500; font-size:13px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .inc::after{content:''; position:absolute; inset:-7px 0}                     /* alvo de toque de 44 px (parte de dentro da borda) */
  .inc b{font-weight:700; color:var(--texto)}                                  /* "+4": quantos jogos do dia o botão traz */
  .inc.sel{border-style:solid; border-color:var(--verde); background:var(--verde-fundo); color:var(--verde-texto); font-weight:600}
  .inc.sel b{color:inherit}
  .legenda{display:flex; align-items:center; gap:8px; margin:14px 4px 0; color:var(--texto3); font-size:12.5px}
  .legenda .canal{min-height:24px; padding:0 9px; font-size:12px}
  .dica, .vazio{margin-top:14px; padding:14px; border:1px solid var(--linha); border-radius:14px; background:var(--faixa); font-size:14px; color:var(--texto2)}
  .vazio{border-style:dashed; background:none; text-align:center; padding:28px 18px}
  .dica b, .vazio b{color:var(--texto); font-weight:600}
  .vazio b{display:block; margin-bottom:4px; font-size:15px}
  .dica p, .vazio p{margin:0}
  .acoes{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .vazio .acoes{justify-content:center}
  .botao{min-height:44px; padding:0 18px; border-radius:22px; background:var(--verde); color:#06140C; font-weight:600; font-size:14px}
  .botao.fantasma{background:none; border:1px solid var(--linha2); color:var(--texto2)}

  /* ---------- folha de filtros ---------- */
  .veu{position:fixed; inset:0; z-index:40; background:rgba(4,6,10,.62); opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s .2s}
  .folha{position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:600px; margin:0 auto; max-height:86vh; max-height:86dvh; overflow:auto; overscroll-behavior:contain;
         background:#0F141F; border:1px solid var(--linha); border-bottom:0; border-radius:20px 20px 0 0; padding:8px 16px calc(18px + env(safe-area-inset-bottom));
         transform:translateY(100%); visibility:hidden; transition:transform .2s ease, visibility 0s .2s}
  .folha:focus{outline:none}
  body.filtrando{overflow:hidden}
  body.filtrando .veu{opacity:1; visibility:visible; transition:opacity .2s ease}
  body.filtrando .folha{transform:none; visibility:visible; transition:transform .2s ease}
  .pega{width:38px; height:4px; border-radius:2px; background:#313C52; margin:2px auto 6px}
  .folha header{display:flex; align-items:center; justify-content:space-between; margin:0 -6px 2px 0}
  .folha h2{margin:0; font:700 18px/1.2 var(--corpo)}
  .folha h3{margin:18px 0 4px; font:600 14px/1.3 var(--corpo); color:var(--texto)}
  .folha p{margin:0 0 10px; color:var(--texto2); font-size:13px}
  .opcoes{display:flex; flex-wrap:wrap; gap:8px}
  .op{min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--linha2); color:var(--texto2); font-weight:500; font-size:14px; display:inline-flex; align-items:center; gap:7px; text-align:left}
  .op::after{content:''; position:absolute; inset:-3px 0}                      /* alvo de toque de 44 px */
  .op.sel{background:var(--verde-fundo); border-color:var(--verde); color:var(--verde-texto); font-weight:600}
  .op.sel::before{content:'✓'; font-weight:700}
  .op.mais::before{content:'+'; font-weight:600; color:var(--texto3)}
  .campo{width:100%; height:44px; border-radius:12px; border:1px solid var(--linha2); background:var(--fundo); color:var(--texto); padding:0 14px; font-size:16px; margin-bottom:10px}
  .pe-folha{margin:18px -10px 0; border-top:1px solid var(--linha); padding-top:4px}
  @media (prefers-reduced-motion:no-preference){ .secao .pulso{animation:pulso 1.4s ease-in-out infinite} }
  @keyframes pulso{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){ .veu,.folha{transition:none !important} .icone.girando svg{animation:none} }
</style>
</head>

<header class="topo" id="topo">
  <div class="miolo">
    <div class="marca">
      <div class="nome">
        <h1>Onde<b>.</b>Assistir</h1>
        <p class="frescor" id="frescor"><span id="quando"></span></p>
      </div>
      <div class="botoes">
        <button type="button" class="icone" id="abre-time" data-acao="abrir-time" aria-haspopup="dialog" aria-label="Meu time: marcar no calendário os dias em que ele joga"><svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.6l2.3 4.7 5.2.75-3.75 3.65.9 5.15L10 14.4l-4.65 2.45.9-5.15L2.5 8.05l5.2-.75z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
        <button type="button" class="icone" id="abre-busca" data-acao="abrir-busca" aria-label="Buscar nos próximos 7 dias"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.6"/><path d="m12 12 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button type="button" class="icone" id="atualizar" data-acao="atualizar" aria-label="Atualizar agora"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 9a6 6 0 1 1-1.9-4.4M15 3v3.2h-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div id="navegacao">
      <nav class="semana" id="dias" aria-label="Dia"></nav>
      <div class="barra">
        <div class="rolagem" id="rapidos" role="group" aria-label="O que mostrar"></div>
        <button type="button" class="rapido filtros" id="abre-filtros" data-acao="abrir-filtros" aria-haspopup="dialog">Filtros</button>
      </div>
    </div>
    <form class="busca" id="busca" role="search" hidden>
      <input type="search" id="q" placeholder="Time, campeonato ou canal" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar nos próximos 7 dias">
      <button type="button" class="texto" data-acao="fechar-busca">Fechar</button>
    </form>
  </div>
</header>

<p class="fuso miolo" id="fuso" hidden>Os horários são de Brasília.</p>
<main class="miolo" id="lista"></main>

<div class="veu" id="veu" data-acao="fechar-folha"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" tabindex="-1"></section>

const semAcento = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nrm = s => semAcento(s).replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();          /* comparação de nomes (placar) */
const nrmBusca = s => semAcento(s).replace(/[^a-z0-9]+/g,' ').trim();                          /* busca: sem acento e sem pontuação */
const chaveTime = s => semAcento(s).replace(/[^a-z0-9]/g,'');                                  /* "Atlético-MG" = "Atletico MG" */

/* ---------- relógio: o app inteiro anda em horário de Brasília ----------
   As datas e horas dos dados são de Brasília; "hoje", "ao vivo" e "agora"
   são calculados nesse fuso mesmo que o aparelho esteja em outro. */
const FMT_BRT = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function relogio(d){
  d = d || new Date();
  const p = {}; for(const x of FMT_BRT.formatToParts(d)) p[x.type] = x.value;
  const h = +p.hour % 24, hhmm = String(h).padStart(2,'0') + ':' + p.minute;      /* há navegador que devolve 24 à meia-noite */
  const local = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return { iso: p.year+'-'+p.month+'-'+p.day, min: h*60 + +p.minute, hhmm, fora: local !== hhmm };
}
const somaDias = (iso, n) => { const d = new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diasEntre = (a, b) => Math.round((Date.parse(b+'T12:00:00Z') - Date.parse(a+'T12:00:00Z')) / 864e5);     /* de a até b */
const minutos = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const diaMes = iso => +iso.slice(8,10) + '/' + +iso.slice(5,7);
function nomeDoDia(iso, i, longo){
  if(i===0) return 'Hoje';
  if(i===1 && longo) return 'Amanhã';                    /* no calendário de 7 colunas vai o dia da semana */
  const s = new Date(iso+'T12:00:00Z').toLocaleDateString('pt-BR', {weekday: longo ? 'long' : 'short', timeZone:'UTC'}).replace('.','');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- placares ao vivo ----------
   Buscados pelo PRÓPRIO navegador na API pública da ESPN, a cada minuto, só
   para o que já começou. Se a API falhar, o app segue sem placar. */
const FEEDS = {   /* liga (nome oficial que o robô grava) -> feed da ESPN */
  'Champions League':'soccer/uefa.champions', 'Copa do Brasil':'soccer/bra.copa_do_brazil',
  'Brasileirão Série A':'soccer/bra.1', 'Brasileirão Série B':'soccer/bra.2',
  'Copa Libertadores':'soccer/conmebol.libertadores', 'Copa Sul-Americana':'soccer/conmebol.sudamericana',
  'Premier League':'soccer/eng.1', 'La Liga':'soccer/esp.1', 'Bundesliga':'soccer/ger.1',
  'Campeonato Italiano':'soccer/ita.1', 'Campeonato Francês':'soccer/fra.1',
  'NBA':'basketball/nba', 'NFL':'football/nfl'
};
const FEEDS_RX = [   /* nomes como o guia escreve, para jogo que não casou com a tabela */
  [/^brasileir[ãa]o$/i,'soccer/bra.1'], [/^la ?liga$/i,'soccer/esp.1'], [/^ligue 1$/i,'soccer/fra.1'],
  [/^(uefa )?champions league$/i,'soccer/uefa.champions'], [/^(copa )?libertadores$/i,'soccer/conmebol.libertadores'],
  [/^(copa )?sul.?americana$/i,'soccer/conmebol.sudamericana'], [/^(campeonato )?italiano$/i,'soccer/ita.1'],
];
function feedDe(e){
  if(FEEDS[e.league]) return FEEDS[e.league];
  if(e.sport!=='Futebol' || e.g==='F' || ehBase(e)) return null;
  for(const [re,f] of FEEDS_RX) if(re.test(e.league)) return f;
  return null;
}
let SCORES = [], assinatura = '';
function simil(a,b){
  a = nrm(a); b = nrm(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .9;
  /* sobreposição de palavras (robusto p/ nomes compostos) */
  const pa=a.split(' '), pb=b.split(' ');
  const comum = pa.filter(w=>w.length>2 && pb.includes(w)).length;
  if(comum>=1 && comum >= Math.min(pa.length,pb.length)) return .85;
  return 0;
}
const isoBRT = d => relogio(d).iso;
async function fetchScores(){
  if(document.visibilityState!=='visible') return;
  const agora = relogio(), ontem = somaDias(agora.iso, -1);
  const pedidos = new Set();                                         /* "feed|YYYYMMDD" */
  if(diaSel===0 || buscando){                                        /* outros dias não têm nada em campo */
    for(const e of LIMPOS){
      if(e.date!==agora.iso && e.date!==ontem) continue;
      const desde = desdeInicio(e, agora);
      if(desde < -5) continue;                                       /* ainda não começou */
      if(e.date===ontem && desde > duracao(e)+30) continue;          /* de ontem, só o que ainda pode estar em campo */
      const f = feedDe(e); if(!f) continue;
      pedidos.add(f+'|'+e.date.replace(/-/g,''));
      /* NBA/NFL: a ESPN agrupa pelo dia dos EUA; jogo da madrugada de
         Brasília pertence à rodada americana da véspera */
      if(!f.startsWith('soccer') && e.t<'06:00') pedidos.add(f+'|'+somaDias(e.date,-1).replace(/-/g,''));
    }
  }
  const novo = [];
  await Promise.allSettled([...pedidos].map(async p=>{
    const [f,d] = p.split('|');
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${f}/scoreboard?dates=${d}`);
    if(!r.ok) return;
    const j = await r.json();
    for(const ev of (j.events||[])){
      const st = ev.status?.type?.state;
      if(st!=='in' && st!=='post') continue;
      const c = ev.competitions?.[0]; if(!c) continue;
      const home = (c.competitors||[]).find(x=>x.homeAway==='home') || c.competitors?.[0];
      const away = (c.competitors||[]).find(x=>x.homeAway==='away') || c.competitors?.[1];
      if(!home||!away) continue;
      const quando = new Date(ev.date);
      novo.push({ feed: f,
                  hn: home.team?.displayName||home.team?.name||'',
                  an: away.team?.displayName||away.team?.name||'',
                  hs: readScore(home.score), as: readScore(away.score), state: st,
                  clock: ev.status?.displayClock||'',
                  det: ev.status?.type?.shortDetail || ev.status?.type?.detail || '',
                  dia: isNaN(quando) ? '' : isoBRT(quando) });
    }
  }));
  novo.sort((a,b)=>(a.feed+a.dia+a.hn).localeCompare(b.feed+b.dia+b.hn));
  SCORES = novo;
  redesenharSeMudou();
}
/* só redesenha a lista se algo mudou: placar, status, ou um jogo entrou/saiu do "ao vivo" */
function redesenharSeMudou(){
  const agora = relogio(), ontem = somaDias(agora.iso, -1);
  const sig = JSON.stringify(SCORES) + '|' + LIMPOS.filter(e => e.date===agora.iso || e.date===ontem).map(e => fase(e, agora)[0]).join('');
  if(sig !== assinatura) desenhar();
  else { const r = el('relogio'); if(r) r.textContent = agora.hhmm; desenharFrescor(agora); }
}
function readScore(s){
  if(s==null) return '';
  if(typeof s==='object') return s.displayValue ?? s.value ?? '';
  return String(s);
}
/* período do jogo em português curto, para caber embaixo da hora */
function rotuloAoVivo(s){
  if(s.feed.startsWith('soccer')){
    const t = (s.clock && s.clock!=="0'") ? s.clock : s.det;
    return /^(ht|half)/i.test(t||'') ? 'intervalo' : (t || 'ao vivo');
  }
  const d = s.det || s.clock || '';
  let m;
  if(/half/i.test(d)) return 'intervalo';
  if((m = /^(\d+:\d+(?:\.\d)?)\s*-\s*(\d)(?:st|nd|rd|th)/i.exec(d))) return m[2] + 'º ' + m[1];
  if((m = /^end of (\d)(?:st|nd|rd|th)/i.exec(d))) return 'fim do ' + m[1] + 'º';
  if((m = /^(\d+:\d+(?:\.\d)?)\s*-\s*(\d?)\s*ot/i.exec(d))) return 'prorr. ' + m[1];
  return d || 'ao vivo';
}
function scoreFor(e){
  /* "espn" = nomes dos times como a ESPN escreve (gravado pelo robô quando o
     jogo do guia casa com a tabela oficial); sem ele, tenta pelo nome do card */
  if(!SCORES.length) return null;
  const feed = feedDe(e);
  const partes = (e.espn||e.match||'').split(/\s+x\s+/i);
  if(!feed || partes.length!==2) return null;
  for(const s of SCORES){
    if(s.feed!==feed || (s.dia && s.dia!==e.date)) continue;   /* mesmo campeonato, mesmo dia */
    const direto  = simil(partes[0],s.hn)>=.8 && simil(partes[1],s.an)>=.8;
    const inverso = simil(partes[0],s.an)>=.8 && simil(partes[1],s.hn)>=.8;
    if(!direto && !inverso) continue;
    return { a: direto ? s.hs : s.as, b: direto ? s.as : s.hs,
             label: s.state==='post' ? 'encerrado' : rotuloAoVivo(s),
             fim: s.state==='post' };
  }
  return null;
}

/* ---------- o que aparece na lista ----------
   Três coisas, cada uma com uma regra só:

const CANAIS = [

  {id:'tnt',       nome:'TNT',             rx:/\btnt\b/i},
  {id:'max',       nome:'HBO Max',         rx:/\bmax\b|hbo/i},

/* o que fica de fora por padrão: [chave, nome na primeira tela, nome na folha] */
const INCLUIR = [['feminino','Feminino','Feminino'], ['base','Base','Base (Sub-20, Sub-17…)'], ['inferiores','Div. inferiores','Divisões inferiores']];
const ESPORTES = [
  ['Futebol', e => e.sport === 'Futebol'],
  ['NBA',     e => /\bnba\b/i.test(e.league)],
  ['NFL',     e => /\bnfl\b/i.test(e.league)],
];
const RAPIDOS = ['Futebol','Seleções','NBA','NFL'];      /* atalhos da primeira tela, além do "Tudo" */
/* Campeonatos de futebol: lista FIXA e curada. Cada opção casa com os eventos por
   padrão (regex), então ruído das fontes nunca vira opção nova. Os padrões cobrem
   o nome oficial (tabela da ESPN) e o jeito que o guia escreve ("Brasileirão",
   "LaLiga", "UEFA Champions League"). "Seleções" junta todo jogo de seleção

const LIGAS = [
  ['Seleções',            e => !!e.sel],
  ['Brasileirão Série A', /^brasileir[ãa]o(\s+s[ée]rie a)?$/i],
  ['Copa do Brasil',      /copa do brasil/i],
  ['Libertadores',        /libertadores/i],

/* nome do item (esporte ou campeonato) -> regra que diz se o jogo é dele */
const REGRA = new Map(ESPORTES.concat(LIGAS.map(([n, r]) => [n, typeof r === 'function' ? r : e => e.sport === 'Futebol' && r.test(e.league)])));
const ehLiga = n => LIGAS.some(l => l[0] === n);
/* Times: o mesmo clube aparece com nomes diferentes conforme a fonte (o guia
   escreve "PSG", a tabela oficial "Paris Saint-Germain"). Cada linha junta as
   grafias de um time; o primeiro nome é o que aparece para escolher. */
const FAMILIAS = [
  ['Atlético-MG','Atlético Mineiro'], ['Athletico-PR','Athletico Paranaense'], ['Vasco da Gama','Vasco'],
  ['Red Bull Bragantino','Bragantino','RB Bragantino'], ['Sport','Sport Recife','Sport-PE'], ['América-MG','América Mineiro'],
  ['Atlético-GO','Atlético Goianiense'],
  ['PSG','Paris Saint-Germain','Paris SG'], ['Bayern de Munique','Bayern Munich','Bayern München','Bayern'],
  ['Atlético de Madrid','Atlético Madrid'], ['Inter de Milão','Internazionale','Inter Milan'], ['Milan','AC Milan'],
  ['Roma','AS Roma'], ['Tottenham','Tottenham Hotspur'], ['Newcastle','Newcastle United'], ['Borussia Dortmund','Dortmund'],
  ['Bayer Leverkusen','Leverkusen'], ['Olympique de Marselha','Marseille','Olympique de Marseille'], ['Lyon','Olympique Lyonnais'],

                   'Internacional','Cruzeiro','Atlético-MG','Real Madrid','Barcelona','Manchester City','Liverpool','PSG','Bayern de Munique'];
const FAMILIA_DE = {};
for(const g of FAMILIAS){ const s = new Set(g.map(chaveTime)); for(const k of s) FAMILIA_DE[k] = s; }
const mesmoTime = (a, b) => { const ka = chaveTime(a), kb = chaveTime(b); return !!ka && (ka===kb || !!(FAMILIA_DE[ka] && FAMILIA_DE[ka].has(kb))); };

/* O que fica salvo no aparelho:
   mostrar, filtroTimes ... "o que mostrar": esportes/campeonatos e times marcados (somam)
   canais ................. só o que passa nesses canais
   incluir ................ feminino, base e divisões inferiores, que ficam de fora por padrão
   times .................. "Meu time": só marca o calendário
   dica ................... se o lembrete do "Meu time" ainda aparece */
const CHAVE = 'oa.estado.v3';

function lerEstado(){
  const guardado = k => { try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v && typeof v==='object' ? v : null; }catch(e){ return null; } };
  let salvo = guardado(CHAVE);
  if(!salvo){

       valendo. Nenhum filtro é herdado (as regras deles mudaram). */
    const antigo = guardado('oa.estado.v2') || guardado('oa.estado');
    salvo = antigo ? { times: antigo.times, dica: antigo.dica } : {};
  }
  const s = JSON.parse(JSON.stringify(PADRAO));
  for(const k of Object.keys(PADRAO)){
    const v = salvo[k];
    if(Array.isArray(PADRAO[k])){ if(Array.isArray(v)) s[k] = [...new Set(v.filter(x => typeof x==='string' && x.trim()))].slice(0,40); }
    else if(typeof v === typeof PADRAO[k]) s[k] = v;
  }

  s.canais = s.canais.filter(id => CANAIS.some(x => x.id===id));
  s.incluir = s.incluir.filter(k => INCLUIR.some(x => x[0]===k));
  return s;
}

let estado = lerEstado();

let HOJE = relogio().iso;            /* dia de Brasília em que o app está */
let diaSel = 0;                      /* aba aberta: 0 = hoje ... 6 */
let busca = '', buscando = false;    /* busca aberta procura nos 7 dias */
let buscaTudo = false;               /* busca sem contar os filtros (vale só enquanto a busca está aberta) */
let folhaModo = 'filtros';           /* o que a folha de baixo mostra: 'filtros' ou 'time' */

/* ---------- regras ---------- */
const aConfirmar = c => /confirmar/i.test(c.n);
const gratis = c => c.y === 'free';
const servicoDe = c => gratis(c) ? null : (CANAIS.find(s => s.rx && s.rx.test(c.n)) || null);
const canalBate = (c, id) => !aConfirmar(c) && (id==='gratis' ? gratis(c) : id==='outros' ? (!gratis(c) && !servicoDe(c)) : (servicoDe(c) || {}).id === id);
/* Categoria do jogo: base (Sub-20, Sub-17...), divisão inferior ou principal.
   "Sub-20" e "U-21" valem em qualquer campo; palavras como "júnior" e "juvenil"
   só no nome do campeonato: há clubes chamados Boca Juniors e Junior Barranquilla.
   (O robô usa a mesma noção de "base" em categoria(), no atualizar_dados.py.) */
const RE_SUB   = /\bsub.?\d{1,2}\b|\bu-?\d{2}\b/i;
const RE_SUB_LIGA = /juvenil|\bj[úu]nior(es)?\b|aspirantes|\bbase\b|\bcopinha\b/i;
const RE_LOWER = /s[ée]rie [bcd]\b|s[ée]rie a[23]\b|[2-9][ªº°]? ?divis|(segunda|terceira|quarta) divis|\bchampionship\b|league (one|two)\b|2\. ?bundesliga|la ?liga 2|ligue 2|liga 2\b/i;
const RE_RESERVA = /\s(B|II)(\s+x\s|\s*$)/;   /* times B: "Ceará B x ...", "... x Bayern II" */
function ehBase(e){ return RE_SUB.test(e.match + ' ' + e.league + ' ' + (e.detail||'')) || RE_SUB_LIGA.test(e.league); }
function ehInferior(e){ return e.sport === 'Futebol' && (RE_LOWER.test(e.league + ' ' + (e.detail||'')) || RE_RESERVA.test(e.match)); }
function ladosDe(e){
  const out = [];
  for(const txt of [e.match, e.espn]){
    const p = String(txt||'').split(/\s+x\s+/i);
    if(p.length===2) out.push(p[0], p[1]);
  }
  return out;
}
function jogaAlgum(e, times){
  if(!times.length) return false;
  const lados = ladosDe(e);
  return times.some(t => lados.some(l => mesmoTime(t, l)));
}
/* "Meu time" é o time principal: jogo de base (Sub-20, Sub-17...) e do feminino não
   contam, mesmo com o mesmo nome. */
const ehMeuTime = e => e.g !== 'F' && !ehBase(e) && jogaAlgum(e, estado.times);

/* 1. "Incluir": o que ainda falta ligar para este jogo entrar na lista. Time que a
   pessoa escolheu pelo nome (no "Meu time" ou nos filtros) não fica de fora por jogar
   numa divisão inferior: quem escolheu a Ponte Preta quer ver a Série B dela. */
const inc = k => estado.incluir.includes(k);
function faltaIncluir(e){
  const f = [];
  if(e.g === 'F') f.push('feminino');
  if(ehBase(e)) f.push('base');
  else if(ehInferior(e) && !jogaAlgum(e, estado.times) && !jogaAlgum(e, estado.filtroTimes)) f.push('inferiores');
  return f.filter(k => !inc(k));
}
/* 2. "O que mostrar": o que combina com QUALQUER item marcado; sem nada marcado, tudo */
const temOQue = () => estado.mostrar.length > 0 || estado.filtroTimes.length > 0;
const combinaOQue = e => !temOQue() || estado.mostrar.some(n => REGRA.has(n) && REGRA.get(n)(e)) || jogaAlgum(e, estado.filtroTimes);
/* 3. "Canais": só o que passa em algum dos marcados */
const combinaCanal = e => !estado.canais.length || e.ch.some(c => estado.canais.some(id => canalBate(c, id)));
const combina = e => combinaOQue(e) && combinaCanal(e);              /* os filtros, sem contar o "Incluir" */
const passa = e => combina(e) && faltaIncluir(e).length === 0;        /* o que entra na lista */

/* Itens mais amplos que já contêm todos os jogos de um time: "Futebol" contém o
   Palmeiras; "NBA", os Lakers; "Seleções", o Brasil. Marcar a parte tira o todo, e
   marcar o todo tira a parte: todo toque muda a lista e nada fica marcado à toa. */
function amplosDoTime(nome){
  const jogos = LIMPOS.filter(e => jogaAlgum(e, [nome]));
  if(!jogos.length) return (POPULARES.some(p => mesmoTime(p, nome)) || FAMILIA_DE[chaveTime(nome)]) ? ['Futebol'] : [];
  return ['Futebol','NBA','NFL','Seleções'].filter(n => jogos.every(REGRA.get(n)));
}
function marcarItem(nome){             /* esporte ou campeonato: liga ou desliga */
  if(!REGRA.has(nome)) return;
  if(estado.mostrar.includes(nome)){ estado.mostrar = estado.mostrar.filter(n => n !== nome); return; }
  if(nome === 'Futebol') estado.mostrar = estado.mostrar.filter(n => !ehLiga(n));
  if(ehLiga(nome)) estado.mostrar = estado.mostrar.filter(n => n !== 'Futebol');
  estado.filtroTimes = estado.filtroTimes.filter(t => !amplosDoTime(t).includes(nome));
  estado.mostrar.push(nome);
}
function marcarTime(nome){             /* time no "o que mostrar" */
  nome = String(nome).trim().slice(0,40);
  if(!nome || estado.filtroTimes.length >= 30 || estado.filtroTimes.some(t => mesmoTime(t, nome))) return;
  const amplos = amplosDoTime(nome);
  estado.mostrar = estado.mostrar.filter(n => !amplos.includes(n));
  estado.filtroTimes.push(nome);
}
/* o que está ligado, item por item: [tipo, valor, como aparece] */
const etiquetasOQue = () => estado.mostrar.map(v => ['item', v, v]).concat(estado.filtroTimes.map(v => ['time', v, v]));
const etiquetasCanal = () => estado.canais.map(v => { const c = CANAIS.find(x => x.id===v) || {}; return ['canal', v, c.curto || c.nome || v]; });
const LISTA_DO_TIPO = { item:'mostrar', time:'filtroTimes', canal:'canais' };
const quantosFiltros = () => estado.mostrar.length + estado.filtroTimes.length + estado.canais.length;
const temFiltro = () => quantosFiltros() > 0;
const esseFiltro = () => quantosFiltros()===1 ? 'esse filtro' : 'esses filtros';
function limparFiltros(){ estado.mostrar = []; estado.filtroTimes = []; estado.canais = []; }
/* "Ao vivo" pelo relógio, com a duração típica de cada esporte; quando a ESPN
   informa o andamento do jogo, vale o que ela diz. */
const DUR = { 'Futebol':120, 'Basquete':150, 'Futebol Americano':200 };
const duracao = e => DUR[e.sport] || 120;
const desdeInicio = (e, agora) => diasEntre(e.date, agora.iso)*1440 + agora.min - minutos(e.t);
function fase(e, agora){
  const sc = scoreFor(e);
  if(sc) return sc.fim ? 'fim' : 'vivo';
  const d = desdeInicio(e, agora);
  return d < 0 ? 'depois' : d <= duracao(e) ? 'vivo' : 'fim';
}
function apelido(nome, e){            /* NBA e NFL: só o apelido ("Knicks"), como na TV */
  if(!/^(NBA|NFL)$/.test(e.league)) return nome;
  return /Trail Blazers$/.test(nome) ? 'Trail Blazers' : nome.split(' ').pop();
}

/* dedup defensivo: descarta registro malformado e colapsa cards do mesmo jogo
   (mesma data+hora, nomes sobrepostos), preferindo o que tem canais reais e
   título mais limpo. Roda uma vez por carga de dados, não a cada desenho. */
let LIMPOS = [];
function prepararDB(){
  const validos = DB.filter(e => e && typeof e.date==='string' && /^\d\d:\d\d$/.test(e.t||'') && typeof e.match==='string'
                                 && typeof e.league==='string' && Array.isArray(e.ch) && e.ch.every(c => c && typeof c.n==='string'));
  const chave = e => e.date+'|'+e.t;
  const limpos = [];
  for(const e of validos){
    const dup = limpos.find(x=> chave(x)===chave(e) && x.sport===e.sport && x.g===e.g && ehBase(x)===ehBase(e) && (()=>{
      const a=(x.match||'').toLowerCase(), b=(e.match||'').toLowerCase();
      const ta=a.split(/\s+x\s+/), tb=b.split(/\s+x\s+/);
      if(ta.length!==2||tb.length!==2) return a.includes(b)||b.includes(a);
      const tem=(txt,t)=>{ const n=t.replace(/[^a-zà-ú ]/gi,'').trim(); return n.length>=3 && txt.includes(n); };
      return (tem(a,tb[0])&&tem(a,tb[1])) || (tem(b,ta[0])&&tem(b,ta[1]));
    })());
    if(dup){
      const nota = ev => (ev.ch.some(c=>!aConfirmar(c))?2:0) - (ev.match.length>40?1:0);
      if(nota(e) > nota(dup)) limpos[limpos.indexOf(dup)] = e;
    } else limpos.push(e);
  }
  LIMPOS = limpos;
}

/* ---------- desenho ---------- */
const porHora = (a,b) => a.t.localeCompare(b.t) || a.match.localeCompare(b.match, 'pt');
const porDiaHora = (a,b) => (a.date+a.t).localeCompare(b.date+b.t) || a.match.localeCompare(b.match, 'pt');
const plural = (n, um, varios) => n + ' ' + (n===1 ? um : varios);

function textoLiga(e){
  let d = (e.detail && e.detail!=='—' && e.detail!=='Tabela oficial') ? String(e.detail) : '';
  d = d.replace(/^QF\b/i,'Quartas').replace(/-(ida|volta)$/i,' ($1)');
  let html = !d ? esc(e.league) : d.toLowerCase().startsWith(e.league.toLowerCase()) ? esc(d) : `${esc(e.league)}<span>, ${esc(d)}</span>`;
  if(e.g==='F' && !/femin/i.test(e.league + ' ' + d)) html += '<span>, feminino</span>';
  return html;
}
function linhaJogo(e, f){
  const lados = e.match.split(/\s+x\s+/i), dois = lados.length===2;
  const sc = f==='depois' ? null : scoreFor(e);
  const st = f==='vivo' ? `<small class="st vivo">${esc(sc ? sc.label : 'ao vivo')}</small>`
           : (f==='fim' && sc) ? '<small class="st">encerrado</small>' : '';
  const meio = sc ? `<b class="pl">${esc(sc.a)}</b> <span class="x">x</span> <b class="pl">${esc(sc.b)}</b>` : '<span class="x">x</span>';
  let confirmar = false;
  const pilulas = e.ch.map(c => {
    if(aConfirmar(c)){ if(confirmar) return ''; confirmar = true; return '<span class="aconfirmar">canal a confirmar</span>'; }
    const yt = /\s*\(YouTube\)$/i.test(c.n), nome = c.n.replace(/\s*\(YouTube\)$/i,'');
    return `<a class="canal${gratis(c)?' gratis':''}" href="${esc(linkDoCanal(c))}" target="_blank" rel="noopener">${esc(nome)}${yt?'<small>YouTube</small>':''}</a>`;
  }).join('');
  return `<li class="jogo${f==='fim'?' fim':''}${f==='vivo'?' vivo':''}">
    <div class="hora"><time>${esc(e.t)}</time>${st}</div>
    <div>
      <div class="times">${ehMeuTime(e)?'<span class="fav" role="img" aria-label="Seu time">★</span>':''}${dois ? `${esc(apelido(lados[0],e))} ${meio} ${esc(apelido(lados[1],e))}` : esc(e.match)}</div>
      <div class="linha2"><div class="liga">${textoLiga(e)}</div><div class="canais">${pilulas}</div></div>
    </div>
  </li>`;
}
function bloco(titulo, jogos, faseDe, extra){
  if(!jogos.length) return '';
  return `<h2 class="secao">${extra||''}${titulo}</h2><ul class="grupo">${jogos.map(e => linhaJogo(e, faseDe(e))).join('')}</ul>`;
}
function vazio(titulo, texto, botoes){
  return `<div class="vazio"><b>${titulo}</b>${texto ? `<p>${texto}</p>` : ''}${botoes ? `<div class="acoes">${botoes}</div>` : ''}</div>`;
}
function htmlDica(){
  if(!estado.dica || estado.times.length) return '';
  return `<div class="dica"><p><b>Tem um time ou uma seleção?</b> Escolha em “Meu time” e os dias em que ele joga ficam marcados com um ponto amarelo no calendário.</p>
    <div class="acoes"><button type="button" class="botao" data-acao="abrir-time">Escolher meu time</button><button type="button" class="botao fantasma" data-acao="dispensar-dica">Agora não</button></div></div>`;
}
/* O que está ligado, escrito no topo da lista. Os atalhos acesos lá em cima já dizem
   parte; a faixa aparece quando há algo que eles não mostram, e aí lista tudo. */
function htmlLigados(){
  const oq = etiquetasOQue(), cs = etiquetasCanal();
  if(!cs.length && !estado.filtroTimes.length && estado.mostrar.every(n => RAPIDOS.includes(n))) return '';
  const etq = ([tipo, valor, nome]) => `<button type="button" class="etq" data-acao="tira-filtro" data-tipo="${tipo}" data-valor="${esc(valor)}" aria-label="Tirar ${esc(nome)}">${esc(nome)}<b aria-hidden="true">×</b></button>`;
  return `<div class="ligados" role="group" aria-label="Filtros ligados"><span>${oq.length ? 'Mostrando só' : 'Mostrando só o que passa em'}</span>${oq.map(etq).join('')}${oq.length && cs.length ? '<span>em</span>' : ''}${cs.map(etq).join('')}<button type="button" class="texto" data-acao="limpar">Limpar</button></div>`;
}
/* "Incluir", na primeira tela: o que fica de fora por padrão, com quantos jogos do
   dia cada botão traria (dos que combinam com os filtros) */
function htmlIncluir(dia){
  const n = { feminino:0, base:0, inferiores:0 };
  for(const e of LIMPOS) if(e.date === dia && combina(e)){ const f = faltaIncluir(e); if(f.length === 1) n[f[0]]++; }
  return `<div class="incluir" role="group" aria-label="Incluir na lista">${INCLUIR.map(([k, nome]) => {
    const ligado = inc(k), q = ligado ? 0 : n[k];
    return `<button type="button" class="inc${ligado?' sel':''}" data-acao="incluir" data-valor="${k}" aria-pressed="${ligado}"><span class="so-leitor">Incluir: </span><b aria-hidden="true">${ligado ? '✓' : '+' + (q || '')}</b>${esc(nome)}${q ? `<span class="so-leitor">, ${plural(q,'jogo','jogos')} neste dia</span>` : ''}</button>`;
  }).join('')}</div>`;
}
/* fim da lista do dia: a legenda do verde, quando há canal grátis na tela */
const htmlLegenda = temGratis => temGratis ? '<p class="legenda"><span class="canal gratis" aria-hidden="true">Canal</span> em verde passa de graça, na TV aberta ou no YouTube.</p>' : '';

function htmlDia(dia, agora, dias){
  const noDia = LIMPOS.filter(e => e.date===dia);
  const doDia = noDia.filter(passa).sort(porHora);
  const ehHoje = dia === agora.iso;
  const fases = new Map(doDia.map(e => [e, fase(e, agora)])), faseDe = e => fases.get(e) || fase(e, agora);
  /* começou ontem e ainda está em campo (NBA das 22h30, por exemplo) */
  const viradas = ehHoje ? LIMPOS.filter(e => e.date===somaDias(dia,-1) && passa(e) && fase(e, agora)==='vivo').sort(porHora) : [];
  let html = htmlDica() + htmlLigados() + (noDia.length ? htmlIncluir(dia) : '');
  if(!doDia.length && !viradas.length){
    if(!noDia.length){
      const ultima = LIMPOS.reduce((m,e) => e.date>m ? e.date : m, '');
      return html + (dia > ultima
        ? vazio('A programação deste dia ainda não saiu.', 'Os canais de futebol costumam ser confirmados uns 2 dias antes. NBA, NFL e as tabelas oficiais entram com até 7 dias.')
        : vazio('Nenhum jogo neste dia.', 'As fontes não listam jogos para esta data.'));
    }
    /* há jogos no dia, mas nenhum entra na lista: diz por quê, e onde há */
    const fora = noDia.filter(combina).length;        /* combinam com os filtros, mas são de feminino, base ou divisão inferior */
    const deFora = fora ? `${plural(fora,'jogo','jogos')} do feminino, de base ou de divisões inferiores ${fora===1 ? 'fica' : 'ficam'} de fora: é só incluir, nos botões acima.` : '';
    if(!temFiltro()) return html + vazio('Nenhum jogo dos times principais neste dia.', deFora);
    const um = quantosFiltros()===1, comEle = um ? 'Com ele' : 'Com eles';
    const outros = dias.map((d,i) => [d, i, LIMPOS.filter(e => e.date===d && passa(e)).length]).filter(x => x[2] > 0);
    const semCanal = temOQue() && estado.canais.length && noDia.some(e => combinaOQue(e) && faltaIncluir(e).length===0);
    return html + vazio(semCanal ? 'Neste dia, nada do que está marcado passa nos canais escolhidos.' : `Nenhum jogo neste dia com ${esseFiltro()}.`,
                        (deFora ? deFora + ' ' : '') + (outros.length ? `${comEle}, há jogo em:` : `${comEle}, não há jogo nos próximos 7 dias.`),
                        outros.map(([d,i,n]) => `<button type="button" class="botao fantasma" data-acao="dia" data-i="${i}">${nomeDoDia(d,i,true)}, ${diaMes(d)} (${n})</button>`).join('')
                        + `<button type="button" class="botao" data-acao="limpar">${um ? 'Limpar filtro' : 'Limpar filtros'}</button>`);
  }
  if(ehHoje){
    const vivo = [...viradas, ...doDia.filter(e => faseDe(e)==='vivo')], depois = doDia.filter(e => faseDe(e)==='depois'), fim = doDia.filter(e => faseDe(e)==='fim');
    html += bloco('Ao vivo', vivo, faseDe, '<i class="pulso" aria-hidden="true"></i>');
    html += `<div class="agora"><span>agora, <span id="relogio">${agora.hhmm}</span>${agora.fora ? ' em Brasília' : ''}</span></div>`;
    html += depois.length ? bloco('A seguir', depois, faseDe) : `<p class="nada">Nada mais hoje${temFiltro() ? ' com ' + esseFiltro() : ''}.</p>`;
    html += bloco('Mais cedo hoje', fim, faseDe);
  } else {
    for(const [nome, de, ate] of [['Madrugada',0,360],['Manhã',360,720],['Tarde',720,1080],['Noite',1080,1440]])
      html += bloco(nome, doDia.filter(e => minutos(e.t)>=de && minutos(e.t)<ate), faseDe);
  }
  return html + htmlLegenda(doDia.concat(viradas).some(e => e.ch.some(gratis)));
}
/* A busca olha a mesma lista do resto do app (filtros e "Incluir"). Se algum
   resultado ficar de fora, ela avisa e oferece buscar em tudo (só enquanto estiver aberta). */
function htmlBusca(agora, dias){
  const q = nrmBusca(busca);
  if(q.length < 2) return '<p class="nada">Digite pelo menos 2 letras: time, campeonato ou canal.</p>';
  const ondeProcurar = e => nrmBusca([e.match, e.espn||'', e.league, e.detail||'', e.sport].concat(e.ch.map(c => c.n)).join(' '));
  const todos = LIMPOS.filter(e => dias.includes(e.date) && ondeProcurar(e).includes(q));
  const lista = (buscaTudo ? todos : todos.filter(passa)).sort(porDiaHora), escondidos = todos.length - lista.length;
  const emTudo = '<button type="button" class="texto" data-acao="busca-tudo">Buscar em tudo</button>';
  let html = buscaTudo ? '' : htmlLigados();
  if(!lista.length) return html + (escondidos
    ? vazio('Nada na lista atual.', plural(escondidos, 'jogo combina', 'jogos combinam') + ' com a busca, mas ' + (escondidos===1 ? 'está' : 'estão') + ' fora da lista (filtros, feminino, base ou divisões inferiores).',
            '<button type="button" class="botao" data-acao="busca-tudo">Buscar em tudo</button>')
    : vazio('Nada encontrado nos próximos 7 dias.', 'Confira a grafia ou tente só uma parte do nome.'));
  html += `<p class="nada">${plural(lista.length,'jogo','jogos')} nos próximos 7 dias${buscaTudo ? ', contando o que está fora da lista' : ''}${escondidos ? `. ${escondidos===1 ? 'Outro está' : 'Outros ' + escondidos + ' estão'} fora da lista. ${emTudo}` : ''}</p>`;
  dias.forEach((d,i) => { html += bloco(`${nomeDoDia(d,i,true)}, ${diaMes(d)}`, lista.filter(e => e.date===d), e => fase(e, agora)); });
  return html;
}

/* troca o HTML de um trecho sem perder o foco de quem navega pelo teclado */
function trocar(caixa, html){
  const a = document.activeElement, dentro = a && caixa.contains(a) && a.dataset && a.dataset.acao;
  const sel = dentro ? `[data-acao="${a.dataset.acao}"]` + (a.dataset.i ? `[data-i="${a.dataset.i}"]` : '') + (a.dataset.tipo ? `[data-tipo="${a.dataset.tipo}"]` : '')
                                                         + (a.dataset.valor ? `[data-valor="${CSS.escape(a.dataset.valor)}"]` : '') : '';
  caixa.innerHTML = html;
  if(sel){ const n = caixa.querySelector(sel); if(n) n.focus({preventScroll:true}); }
}
function desenharFrescor(agora){
  let txt = '', velho = false;
  if(DADOS_EM){
    const r = relogio(DADOS_EM);
    velho = Date.now() - DADOS_EM > 12*3600*1000;       /* o robô costuma passar a cada 6 a 10 horas */
    txt = r.iso===agora.iso ? `atualizado às ${r.hhmm}` : `atualizado ${diaMes(r.iso)} às ${r.hhmm}`;      /* só números do relógio */
  }
  if(el('quando').textContent !== txt) el('quando').textContent = txt;
  el('frescor').classList.toggle('velho', velho);
}
function desenhar(){
  const agora = relogio();
  if(agora.iso !== HOJE){ HOJE = agora.iso; diaSel = 0; }     /* virou o dia em Brasília: "Hoje" volta a ser hoje */
  const dias = [0,1,2,3,4,5,6].map(i => somaDias(HOJE, i));
  el('fuso').hidden = !agora.fora;
  el('navegacao').hidden = buscando; el('busca').hidden = !buscando;
  /* calendário: ponto amarelo no dia em que o "Meu time" joga. Vale a mesma lista
     da tela: dia com ponto tem jogo com estrela, e vice-versa. */
  trocar(el('dias'), dias.map((d,i) => {
    const joga = LIMPOS.some(e => e.date===d && ehMeuTime(e) && passa(e));
    return `<button type="button" class="dia${i===diaSel?' sel':''}" data-acao="dia" data-i="${i}" aria-pressed="${i===diaSel}">${nomeDoDia(d,i)}<small>${diaMes(d)}</small>${joga?'<i aria-hidden="true"></i><span class="so-leitor">, seu time joga</span>':''}</button>`;
  }).join(''));
  el('abre-time').classList.toggle('tem', estado.times.length > 0);
  /* atalhos: o mesmo "o que mostrar" da folha. "Tudo" aceso = nenhum filtro ligado */
  const atalho = (r, ligado) => `<button type="button" class="rapido${ligado?' sel':''}" data-acao="rapido" data-valor="${r}" aria-pressed="${ligado}">${r}</button>`;
  trocar(el('rapidos'), atalho('Tudo', !temFiltro()) + RAPIDOS.map(r => atalho(r, estado.mostrar.includes(r))).join(''));
  const n = quantosFiltros();
  el('abre-filtros').innerHTML = 'Filtros' + (n ? `<span class="n" aria-label="${plural(n,'filtro ligado','filtros ligados')}">${n}</span>` : '');
  desenharFrescor(agora);
  trocar(el('lista'), buscando ? htmlBusca(agora, dias) : htmlDia(dias[diaSel], agora, dias));
  const ontem = somaDias(agora.iso, -1);
  assinatura = JSON.stringify(SCORES) + '|' + LIMPOS.filter(e => e.date===agora.iso || e.date===ontem).map(e => fase(e, agora)[0]).join('');
}

/* ---------- folha de baixo: "Filtros" ou "Meu time" ---------- */
const op = (tipo, valor, rotulo, sel) =>
  `<button type="button" class="op${sel?' sel':''}" data-acao="op" data-tipo="${tipo}" data-valor="${esc(valor)}" aria-pressed="${!!sel}">${esc(rotulo)}</button>`;
function nomesDosDados(){
  const nomes = new Map();
  for(const e of LIMPOS){
    if(ehBase(e)) continue;
    const p = e.match.split(/\s+x\s+/i);
    if(p.length===2) for(const n of p){ const k = chaveTime(n); if(k && !nomes.has(k)) nomes.set(k, n.trim()); }
  }
  return [...nomes.values()].sort((a,b) => a.localeCompare(b,'pt'));
}
/* escolha de times: serve ao filtro "Times" (alvo 'filtroTimes') e ao "Meu time" (alvo 'times') */
function htmlEscolha(alvo, texto){
  const marcados = estado[alvo];
  const q = nrmBusca(texto), jaTenho = n => marcados.some(t => mesmoTime(t, n));
  const cand = [], poe = n => { if(!jaTenho(n) && !cand.some(c => mesmoTime(c, n))) cand.push(n); };
  if(q.length < 2) POPULARES.forEach(poe);
  else {
    for(const g of FAMILIAS) if(g.some(n => nrmBusca(n).includes(q))) poe(g[0]);
    for(const n of POPULARES.concat(nomesDosDados())) if(nrmBusca(n).includes(q)) poe(n);
  }
  const lista = cand.slice(0, q.length < 2 ? 12 : 8);
  const livre = texto.trim();
  const novo = q.length >= 3 && !jaTenho(livre) && !lista.some(c => mesmoTime(c, livre));
  return marcados.map(t => `<button type="button" class="op sel" data-acao="tira-time" data-valor="${esc(t)}" aria-pressed="true" aria-label="${esc(t)}, toque para tirar">${esc(t)}</button>`).join('')
       + lista.map(n => `<button type="button" class="op mais" data-acao="poe-time" data-valor="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('')
       + (novo ? `<button type="button" class="op mais" data-acao="poe-time" data-valor="${esc(livre)}" aria-pressed="false">Adicionar “${esc(livre)}”</button>` : '');
}
const campoDeTime = alvo => `<input class="campo" id="busca-time" type="search" placeholder="Buscar time ou seleção" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Buscar time ou seleção">
    <div class="opcoes" id="op-times" data-alvo="${alvo}">${htmlEscolha(alvo, '')}</div>`;
function desenharFolha(){
  const topo = titulo => `<div class="pega" aria-hidden="true"></div>
    <header><h2 id="folha-titulo">${titulo}</h2><button type="button" class="texto" data-acao="fechar-folha">Pronto</button></header>`;
  el('folha').innerHTML = folhaModo==='time' ? `${topo('Meu time')}
    <p>Escolha seu time e sua seleção, quantos quiser. O dia em que eles jogam ganha um ponto amarelo no calendário, e o jogo, uma estrela.</p>
    <p>Vale só para o time principal: jogos de base (Sub-20, Sub-17) e do feminino não contam. Isso não filtra a lista.</p>
    ${campoDeTime('times')}`
  : `${topo('Filtros')}
    <p>A lista mostra o que estiver marcado: esportes, campeonatos e times se somam. Sem nada marcado, mostra tudo.</p>
    <h3>Esportes</h3>
    <div class="opcoes">${ESPORTES.map(x => op('item', x[0], x[0], estado.mostrar.includes(x[0]))).join('')}</div>
    <h3>Campeonatos de futebol</h3>
    <div class="opcoes">${LIGAS.map(l => op('item', l[0], l[0], estado.mostrar.includes(l[0]))).join('')}</div>
    <h3>Times</h3>
    ${campoDeTime('filtroTimes')}
    <h3>Canais</h3>
    <p>Com canal marcado, ficam só os jogos que passam nele.</p>
    <div class="opcoes">${CANAIS.map(c => op('canal', c.id, c.nome, estado.canais.includes(c.id))).join('')}</div>
    <h3>Incluir na lista</h3>
    <p>Ficam de fora até você ligar.</p>
    <div class="opcoes">${INCLUIR.map(x => op('incluir', x[0], x[2], inc(x[0]))).join('')}</div>
    <div class="pe-folha"><button type="button" class="texto" data-acao="limpar-folha">Limpar filtros</button></div>`;
}
/* depois de um toque na folha: acerta o que ficou marcado (marcar a parte tira o todo)
   sem redesenhar a folha inteira, para ela não pular */
function acertarFolha(){
  const marcado = { item: v => estado.mostrar.includes(v), canal: v => estado.canais.includes(v), incluir: v => inc(v) };
  for(const b of el('folha').querySelectorAll('[data-acao="op"]')){
    const ligado = !!(marcado[b.dataset.tipo] && marcado[b.dataset.tipo](b.dataset.valor));
    b.classList.toggle('sel', ligado); b.setAttribute('aria-pressed', ligado);
  }
  const caixa = el('op-times');
  if(caixa && caixa.dataset.alvo === 'filtroTimes') caixa.innerHTML = htmlEscolha('filtroTimes', el('busca-time').value);
}
function abrirFolha(modo){
  folhaModo = modo;
  desenharFolha();
  document.body.classList.add('filtrando');
  el('topo').inert = true; el('lista').inert = true;
  el('folha').scrollTop = 0; el('folha').focus({preventScroll:true});
}
function fecharFolha(){
  if(!document.body.classList.contains('filtrando')) return;
  document.body.classList.remove('filtrando');
  el('topo').inert = false; el('lista').inert = false;
  if(estado.times.length) estado.dica = false;
  salvar(); desenhar(); mostrarEscolhidos();
  el(folhaModo==='time' ? 'abre-time' : 'abre-filtros').focus({preventScroll:true});
}
/* ao abrir o app e ao fechar a folha, o primeiro atalho aceso fica à vista na fileira que rola */
function mostrarEscolhidos(){
  const s = el('rapidos').querySelector('.sel'); if(s) s.scrollIntoView({inline:'nearest', block:'nearest'});
}
function alternar(lista, valor){ const i = lista.indexOf(valor); if(i<0) lista.push(valor); else lista.splice(i,1); return i<0; }
function abrirBusca(){ buscando = true; buscaTudo = false; desenhar(); el('q').value = busca; el('q').focus(); fetchScores(); }
function fecharBusca(){ if(!buscando) return; buscando = false; buscaTudo = false; busca = ''; el('q').value = ''; desenhar(); el('abre-busca').focus({preventScroll:true}); fetchScores(); }

/* Botão de atualizar: busca os dados de novo (não só redesenha) */
async function atualizar(){
  const b = el('atualizar'); if(b.disabled) return;
  b.disabled = true; b.classList.add('girando'); b.setAttribute('aria-label','Atualizando');
  await tryLoadJson(); await fetchScores();
  b.disabled = false; b.classList.remove('girando'); b.setAttribute('aria-label','Atualizar agora');
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]'); if(!b) return;
  const d = b.dataset;
  switch(d.acao){
    case 'dia':            diaSel = +d.i; desenhar(); window.scrollTo(0,0); fetchScores(); break;
    case 'rapido':         if(d.valor === 'Tudo') limparFiltros(); else marcarItem(d.valor); salvar(); desenhar(); window.scrollTo(0,0); if(d.valor === 'Tudo') mostrarEscolhidos(); break;   /* o atalho tocado já está à vista: a fileira não pula */
    case 'incluir':        alternar(estado.incluir, d.valor); salvar(); desenhar(); break;
    case 'abrir-filtros':  abrirFolha('filtros'); break;
    case 'abrir-time':     abrirFolha('time'); break;
    case 'fechar-folha':   fecharFolha(); break;
    case 'abrir-busca':    abrirBusca(); break;
    case 'fechar-busca':   fecharBusca(); break;
    case 'busca-tudo':     buscaTudo = true; desenhar(); break;
    case 'atualizar':      atualizar(); break;
    case 'dispensar-dica': estado.dica = false; salvar(); desenhar(); break;
    case 'limpar':         limparFiltros(); salvar(); desenhar(); mostrarEscolhidos(); break;
    case 'limpar-folha':   limparFiltros(); salvar(); acertarFolha(); desenhar(); el('folha').focus({preventScroll:true}); break;
    case 'tira-filtro':    if(LISTA_DO_TIPO[d.tipo]){ estado[LISTA_DO_TIPO[d.tipo]] = estado[LISTA_DO_TIPO[d.tipo]].filter(v => v !== d.valor); salvar(); desenhar(); } break;
    case 'op': {
      if(d.tipo === 'item') marcarItem(d.valor);
      else if(d.tipo === 'canal') alternar(estado.canais, d.valor);
      else if(d.tipo === 'incluir') alternar(estado.incluir, d.valor);
      else break;
      acertarFolha(); salvar(); desenhar(); break;
    }
    case 'poe-time': {
      const alvo = el('op-times').dataset.alvo==='times' ? 'times' : 'filtroTimes';
      if(alvo === 'filtroTimes') marcarTime(d.valor);
      else if(estado.times.length < 30 && !estado.times.some(t => mesmoTime(t, d.valor))) estado.times.push(d.valor.trim().slice(0,40));
      el('busca-time').value = ''; el('op-times').innerHTML = htmlEscolha(alvo, ''); acertarFolha(); salvar(); desenhar(); el('busca-time').focus({preventScroll:true}); break;
    }
    case 'tira-time': {
      const alvo = el('op-times').dataset.alvo==='times' ? 'times' : 'filtroTimes';
      estado[alvo] = estado[alvo].filter(t => t !== d.valor);
      el('op-times').innerHTML = htmlEscolha(alvo, el('busca-time').value); acertarFolha(); salvar(); desenhar(); el('busca-time').focus({preventScroll:true}); break;
    }
  }
});
document.addEventListener('input', ev => {
  if(ev.target.id==='q'){ busca = ev.target.value; desenhar(); }
  else if(ev.target.id==='busca-time') el('op-times').innerHTML = htmlEscolha(el('op-times').dataset.alvo==='times' ? 'times' : 'filtroTimes', ev.target.value);
});
document.addEventListener('keydown', ev => {
  if(ev.key==='Escape'){ if(document.body.classList.contains('filtrando')) fecharFolha(); else fecharBusca(); }
  if(ev.key==='Enter' && ev.target.id==='busca-time'){ const p = el('op-times').querySelector('[data-acao="poe-time"]'); if(p && ev.target.value.trim().length>=2){ ev.preventDefault(); p.click(); } }
});
el('busca').addEventListener('submit', ev => { ev.preventDefault(); el('q').blur(); });

/* App instalado na tela de início fica dias em segundo plano: ao voltar (e a
   cada minuto, se aberto), confere se o dia virou e se os dados envelheceram. */
function sincronizar(){
  if(document.visibilityState!=='visible') return;
  if(relogio().iso !== HOJE) desenhar();                   /* virou o dia em Brasília */
  if(Date.now() - lastTry > 10*60*1000) tryLoadJson();     /* dados com mais de 10 min */
  fetchScores();
}
document.addEventListener('visibilitychange', sincronizar);
window.addEventListener('pageshow', ev => { if(ev.persisted) sincronizar(); });

prepararDB(); desenhar(); mostrarEscolhidos();
tryLoadJson().then(() => { document.body.dataset.pronto = '1'; });
fetchScores();
setInterval(sincronizar, 60000);   /* placares, "ao vivo", virada do dia e dados novos */
</script>

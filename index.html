<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0D13">
<title>Onde Assistir — Guia de Transmissões</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13; --surface:#121724; --chip:#1A2130; --chip-on:#10301F;
    --border:#222B3C; --border-on:#2FD380;
    --text:#E8EDF6; --muted:#8C96A8; --faint:#5A6478;
    --green:#2FD380; --orange:#F7A823; --live:#FF4D5E;
    --tv:#7AA7FF; --stream:#C792EA; --free:#2FD380;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.45;
    padding-bottom:48px;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 14px}

  /* ---------- Top bar ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(10,13,19,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top);
  }
  .brand{display:flex; align-items:baseline; gap:8px; padding:14px 0 4px}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:26px; letter-spacing:.5px; margin:0; text-transform:uppercase;
  }
  .brand h1 .dot{color:var(--green)}
  .brand span{font-size:12px; color:var(--muted)}
  .daytabs{display:flex; gap:6px; padding:8px 0 12px; overflow-x:auto; scrollbar-width:none}
  .daytabs::-webkit-scrollbar{display:none}
  .daytab{
    flex:0 0 auto; border:1px solid var(--border); background:var(--chip);
    color:var(--muted); border-radius:999px; padding:7px 16px;
    font:600 13px 'Inter',sans-serif; cursor:pointer; transition:.15s;
  }
  .daytab.on{background:var(--green); border-color:var(--green); color:#06140C}
  .daytab.pick{position:relative; overflow:hidden}
  .daytab.pick input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer}
  .daytab small{display:block; font-weight:500; font-size:10px; opacity:.75}

  /* ---------- Filtros ---------- */
  .panel{margin-top:14px}
  .section{border-bottom:1px dashed var(--border); padding:10px 0}
  .sec-head{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:2px; text-transform:uppercase; color:var(--muted);
  }
  .sec-head .tri{color:var(--green); font-size:11px; transition:transform .2s}
  .section.closed .tri{transform:rotate(-90deg)}
  .sec-head .count{
    margin-left:auto; font-family:'Inter'; font-size:11px; font-weight:600;
    letter-spacing:0; color:#06140C; background:var(--green);
    border-radius:999px; padding:1px 8px; display:none;
  }
  .sec-head .count.show{display:inline-block}
  .sec-body{padding-top:10px}
  .section.closed .sec-body{display:none}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1px solid var(--border); background:var(--chip); color:var(--text);
    border-radius:999px; padding:8px 15px; font:500 13.5px 'Inter',sans-serif;
    cursor:pointer; transition:.12s;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--chip-on); border-color:var(--border-on); color:var(--green); font-weight:600}
  .clear-link{
    background:none; border:none; color:var(--green); font:500 12.5px 'Inter';
    text-decoration:underline; cursor:pointer; padding:0; margin-bottom:8px;
  }
  .seg{display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; width:max-content}
  .seg button{
    background:var(--chip); border:none; color:var(--muted);
    font:600 13px 'Inter'; padding:8px 18px; cursor:pointer;
  }
  .seg button.on{background:var(--green); color:#06140C}
  .searchrow{display:flex; gap:10px; margin:14px 0 4px}
  .searchrow input{
    flex:1; background:var(--chip); border:1px solid var(--border);
    border-radius:12px; color:var(--text); font:400 14px 'Inter';
    padding:11px 14px; outline:none;
  }
  .searchrow input:focus{border-color:var(--green)}
  .searchrow input::placeholder{color:var(--faint)}
  .actions{display:flex; align-items:center; gap:12px; margin:12px 0 4px}
  .btn-update{
    background:var(--green); color:#06140C; border:none; border-radius:999px;
    font:700 14px 'Inter'; padding:11px 26px; cursor:pointer;
  }
  .btn-ghost{
    background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:999px; font:600 13px 'Inter'; padding:10px 18px; cursor:pointer;
  }

  /* ---------- Resultados ---------- */
  .meta{color:var(--muted); font-size:13px; margin:18px 0 6px}
  .meta b{color:var(--text)}
  .timeblock{
    font-family:'Barlow Condensed'; font-weight:700; font-size:14px;
    letter-spacing:3px; text-transform:uppercase; color:var(--faint);
    margin:20px 0 8px; display:flex; align-items:center; gap:10px;
  }
  .timeblock::after{content:''; flex:1; height:1px; background:var(--border)}
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px; margin-bottom:10px;
    display:grid; grid-template-columns:74px 1fr; gap:12px;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .card{animation:none} }
  .quiet .card{animation:none} /* atualização automática de placar não re-anima a lista */
  .when{display:flex; flex-direction:column; align-items:flex-start; gap:4px}
  .time{
    font-family:'Barlow Condensed'; font-weight:800; font-size:34px;
    line-height:.9; color:var(--orange); letter-spacing:.5px;
  }
  .live-pill{
    display:inline-flex; align-items:center; gap:5px;
    font:700 10px 'Inter'; letter-spacing:1px; color:var(--live);
  }
  .live-pill i{
    width:7px; height:7px; border-radius:50%; background:var(--live);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{50%{opacity:.25}}
  .gender-tag{font:600 10px 'Inter'; letter-spacing:1px; color:var(--faint)}
  .score{font-family:'Barlow Condensed'; font-weight:800; font-size:26px; line-height:1; color:var(--text)}
  .score span{color:var(--faint); font-size:18px}
  .score-status{font:700 10px 'Inter'; letter-spacing:1px; color:var(--live)}
  .score-status.fim{color:var(--faint)}
  .ev-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .sport-tag{
    font:700 10.5px 'Inter'; letter-spacing:1.5px; text-transform:uppercase;
    background:var(--chip); border-radius:6px; padding:3px 8px; color:var(--muted);
  }
  .matchup{font-weight:700; font-size:15.5px}
  .league{color:var(--muted); font-size:13px; margin-top:2px}
  .league em{color:var(--faint); font-style:italic; font-size:12px}
  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .badge{
    font:600 12px 'Inter'; border-radius:999px; padding:5px 12px;
    border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; cursor:pointer; transition:.12s;
  }
  .badge:active{transform:scale(.95)}
  .badge::after{content:'↗'; font-size:10px; opacity:.5}
  .verified{color:var(--green); font-size:11px; font-weight:700}
  .badge i{width:6px; height:6px; border-radius:50%}
  .badge.tv{color:var(--tv)} .badge.tv i{background:var(--tv)}
  .badge.stream{color:var(--stream)} .badge.stream i{background:var(--stream)}
  .badge.free{color:var(--free)} .badge.free i{background:var(--free)}
  .badge.tbd{color:var(--faint); border-style:dashed}
  .badge.tbd::after{content:''}
  .legend{display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--faint)}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .legend i{width:7px; height:7px; border-radius:50%}
  .empty{
    text-align:center; color:var(--muted); padding:40px 20px;
    border:1px dashed var(--border); border-radius:var(--radius); margin-top:16px;
  }
  .empty b{color:var(--text); display:block; margin-bottom:6px}
  button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--green); outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>Onde<span class="dot">.</span>Assistir</h1>
      <span>guia de transmissões</span>
    </div>
    <div class="daytabs" id="daytabs"></div>
  </div>
</header>

<main class="wrap">
  <div class="panel">

    <div class="section" data-sec="sport">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> Esportes <span class="count" id="cnt-sport"></span></div>
      <div class="sec-body">
        <button class="clear-link" onclick="clearFilter('sport')">Limpar</button>
        <div class="chips" id="chips-sport"></div>
      </div>
    </div>

    <div class="section" data-sec="gender">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> Gênero</div>
      <div class="sec-body">
        <div class="seg" id="seg-gender">
          <button data-v="" class="on">Todos</button>
          <button data-v="M">Masculino</button>
          <button data-v="F">Feminino</button>
        </div>
      </div>
    </div>

    <div class="section" data-sec="cat">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> Categoria</div>
      <div class="sec-body">
        <div class="chips">
          <button class="chip" id="chip-cat-sub" onclick="toggleCat('sub',this)">Sub / base</button>
          <button class="chip" id="chip-cat-lower" onclick="toggleCat('lower',this)">Divisões inferiores</button>
        </div>
        <div style="font-size:11px;color:var(--faint);margin-top:8px">Desmarcados, jogos de base (Sub-17, Sub-20…), times B e divisões de acesso (Série B/C, 2ª divisões) ficam ocultos.</div>
      </div>
    </div>

    <div class="section" data-sec="country">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> País / Região <span class="count" id="cnt-country"></span></div>
      <div class="sec-body">
        <button class="clear-link" onclick="clearFilter('country')">Todos os países</button>
        <div class="chips" id="chips-country"></div>
      </div>
    </div>

    <div class="section" data-sec="league">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> Campeonatos / Ligas <span class="count" id="cnt-league"></span></div>
      <div class="sec-body">
        <button class="clear-link" onclick="clearFilter('league')">Limpar campeonatos</button>
        <div class="chips" id="chips-league"></div>
      </div>
    </div>

    <div class="section" data-sec="team">
      <div class="sec-head" onclick="toggleSec(this)"><span class="tri">▼</span> Times <span class="count" id="cnt-team"></span></div>
      <div class="sec-body">
        <button class="clear-link" onclick="clearFilter('team')">Limpar times</button>
        <div class="chips" id="chips-team"></div>
      </div>
    </div>

    <div class="searchrow">
      <input id="search" type="search" placeholder="Buscar time, liga ou canal…" autocomplete="off">
    </div>

    <div class="actions">
      <button class="btn-update" id="btn-update" onclick="atualizar()">Atualizar</button>
      <button class="btn-ghost" onclick="clearAll()">Limpar tudo</button>
    </div>

    <div class="legend">
      <span><i style="background:var(--tv)"></i> TV</span>
      <span><i style="background:var(--stream)"></i> Streaming</span>
      <span><i style="background:var(--free)"></i> Grátis / aberto</span>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <div id="results"></div>
</main>

/* Carrega o eventos.json hospedado ao lado; se falhar (offline, arquivo
   local), o app segue com os dados embutidos. */
let DATA_AT = (typeof GENERATED_AT==='string' && GENERATED_AT) ? GENERATED_AT : '';
let lastTry = 0;
async function tryLoadJson(){
  lastTry = Date.now();
  try{
    const r = await fetch(`eventos.json?t=${Date.now()}`, {cache:'no-store'});
    if(r.ok){
      const data = await r.json();
      if(Array.isArray(data) && data.length){
        DB.length = 0; DB.push(...data);
        /* o carimbo "dados de" acompanha o arquivo realmente carregado */
        const lm = new Date(r.headers.get('last-modified') || '');
        if(!isNaN(lm)) DATA_AT = lm.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' +
                                 lm.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        prepararDB(); buildAllChips(); render();
        return true;
      }
    }
  }catch(e){ /* offline ou arquivo local — segue com dados embutidos */ }
  return false;
}
/* ---------- placares ao vivo ----------
   Buscados pelo PRÓPRIO navegador na API pública da ESPN, a cada 60s, só
   para o que já começou no dia aberto. Se a API falhar, o app segue sem placar. */
const FEEDS = {   /* liga (nome oficial que o robô grava) -> feed da ESPN */
  'Champions League':'soccer/uefa.champions', 'Copa do Brasil':'soccer/bra.copa_do_brazil',
  'Brasileirão Série A':'soccer/bra.1', 'Brasileirão Série B':'soccer/bra.2',
  'Copa Libertadores':'soccer/conmebol.libertadores', 'Copa Sul-Americana':'soccer/conmebol.sudamericana',
  'Premier League':'soccer/eng.1', 'La Liga':'soccer/esp.1', 'Bundesliga':'soccer/ger.1',
  'Campeonato Italiano':'soccer/ita.1', 'Campeonato Francês':'soccer/fra.1',
  'NBA':'basketball/nba', 'NFL':'football/nfl'
};
const FEEDS_RX = [   /* nomes como o guia escreve, para jogo que não casou com a tabela */
  [/^brasileir[ãa]o$/i,'soccer/bra.1'], [/^la ?liga$/i,'soccer/esp.1'], [/^ligue 1$/i,'soccer/fra.1'],
  [/^(uefa )?champions league$/i,'soccer/uefa.champions'], [/^(copa )?libertadores$/i,'soccer/conmebol.libertadores'],
  [/^(copa )?sul.?americana$/i,'soccer/conmebol.sudamericana'], [/^(campeonato )?italiano$/i,'soccer/ita.1'],
];
function feedDe(e){
  if(FEEDS[e.league]) return FEEDS[e.league];
  if(e.sport!=='Futebol' || e.g==='F' || isSub(e)) return null;
  for(const [re,f] of FEEDS_RX) if(re.test(e.league)) return f;
  return null;
}
let SCORES = [], scoreSig = '';
const nrm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
function simil(a,b){
  a = nrm(a); b = nrm(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .9;
  /* sobreposição de palavras (robusto p/ nomes compostos) */
  const pa=a.split(' '), pb=b.split(' ');
  const comum = pa.filter(w=>w.length>2 && pb.includes(w)).length;
  if(comum>=1 && comum >= Math.min(pa.length,pb.length)) return .85;
  return 0;
}
const isoLocal = d => d.toLocaleDateString('en-CA');                 /* YYYY-MM-DD no fuso do aparelho */
const isoBRT   = d => d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});   /* datas dos dados são de Brasília */
const minutosDe = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function vespera(iso){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()-1); return isoLocal(d); }
async function fetchScores(){
  if(document.visibilityState!=='visible') return;
  const dia = DAYS[state.day]?.iso, agora = new Date(), hoje = isoLocal(agora);
  const pedidos = new Set();                                         /* "feed|YYYYMMDD" */
  if(dia && dia<=hoje){
    const minAgora = agora.getHours()*60 + agora.getMinutes();
    for(const e of DB){
      if(e.date!==dia || (dia===hoje && minutosDe(e.t) > minAgora+5)) continue;   /* ainda não começou */
      const f = feedDe(e); if(!f) continue;
      pedidos.add(f+'|'+dia.replace(/-/g,''));
      /* NBA/NFL: a ESPN agrupa pelo dia dos EUA; jogo da madrugada de
         Brasília pertence à rodada americana da véspera */
      if(!f.startsWith('soccer') && e.t<'06:00') pedidos.add(f+'|'+vespera(dia).replace(/-/g,''));
    }
  }
  const novo = [];
  await Promise.allSettled([...pedidos].map(async p=>{
    const [f,d] = p.split('|');
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${f}/scoreboard?dates=${d}`);
    if(!r.ok) return;
    const j = await r.json();
    for(const ev of (j.events||[])){
      const st = ev.status?.type?.state;
      if(st!=='in' && st!=='post') continue;
      const c = ev.competitions?.[0]; if(!c) continue;
      const home = (c.competitors||[]).find(x=>x.homeAway==='home') || c.competitors?.[0];
      const away = (c.competitors||[]).find(x=>x.homeAway==='away') || c.competitors?.[1];
      if(!home||!away) continue;
      const quando = new Date(ev.date);
      novo.push({ feed: f,
                  hn: home.team?.displayName||home.team?.name||'',
                  an: away.team?.displayName||away.team?.name||'',
                  hs: readScore(home.score), as: readScore(away.score), state: st,
                  clock: ev.status?.displayClock||'',
                  det: ev.status?.type?.shortDetail || ev.status?.type?.detail || '',
                  dia: isNaN(quando) ? '' : isoBRT(quando) });
    }
  }));
  /* só redesenha se algo mudou: placar, status, ou um jogo entrou/saiu do "AO VIVO" */
  novo.sort((a,b)=>(a.feed+a.dia+a.hn).localeCompare(b.feed+b.dia+b.hn));
  const sig = JSON.stringify(novo) + '|' + DB.filter(isLive).map(e=>e.t+e.match).join(';');
  SCORES = novo;
  if(sig!==scoreSig){ scoreSig = sig; render(true); }
}
function readScore(s){
  if(s==null) return '';
  if(typeof s==='object') return s.displayValue ?? s.value ?? '';
  return String(s);
}
function scoreFor(e){
  /* "espn" = nomes dos times como a ESPN escreve (gravado pelo robô quando o
     jogo do guia casa com a tabela oficial); sem ele, tenta pelo nome do card */
  const feed = feedDe(e);
  const partes = (e.espn||e.match||'').split(/\s+x\s+/i);
  if(!feed || partes.length!==2) return null;
  for(const s of SCORES){
    if(s.feed!==feed || (s.dia && s.dia!==e.date)) continue;   /* mesmo campeonato, mesmo dia */
    const direto  = simil(partes[0],s.hn)>=.8 && simil(partes[1],s.an)>=.8;
    const inverso = simil(partes[0],s.an)>=.8 && simil(partes[1],s.hn)>=.8;
    if(!direto && !inverso) continue;
    const aoVivo = (s.clock && s.clock!=='0\'') ? s.clock : (s.det || 'Ao vivo');
    return { a: direto ? s.hs : s.as, b: direto ? s.as : s.hs,
             label: s.state==='post' ? 'Encerrado' : aoVivo,
             fim: s.state==='post' };
  }
  return null;
}

/* todo texto que vem dos dados passa por aqui antes de virar HTML */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = { day:0, sport:new Set(), gender:'', country:new Set(), league:new Set(), team:new Set(), catSub:false, catLower:false, q:'' };

/* Abas de dia com data ABSOLUTA (ISO). Um evento só aparece na aba
   cuja data bate exatamente com a dele — dado antigo nunca vira "hoje".
   Baseline de 7 dias + seletor livre de data (📅). */
let customIso = null;
function makeDays(){
  const arr = [0,1,2,3,4,5,6].map(i=>{
    const dt = new Date(); dt.setDate(dt.getDate()+i);
    const iso = dt.toLocaleDateString('en-CA'); /* YYYY-MM-DD local */
    const w = dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    const label = i===0 ? 'Hoje' : i===1 ? 'Amanhã' : w.charAt(0).toUpperCase()+w.slice(1);
    return { label, sub: dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), iso };
  });
  if(customIso && !arr.some(d=>d.iso===customIso)){
    const dt = new Date(customIso+'T12:00:00');
    const w = dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
    arr.push({ label: w.charAt(0).toUpperCase()+w.slice(1),
               sub: dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),
               iso: customIso });
  }
  return arr;
}
let DAYS = makeDays();
function pickDate(v){
  if(!v) return;
  customIso = v;
  DAYS = makeDays();
  state.day = DAYS.findIndex(d=>d.iso===v);
  buildDayTabs(); buildLeagueChips(); render();
}

/* Ligas: lista FIXA e curada. Cada chip casa com os eventos por padrão
   (regex), então ruído das fontes nunca vira chip novo. Os padrões cobrem o
   nome oficial (tabela da ESPN) e o jeito que o guia escreve ("Brasileirão",
   "LaLiga", "UEFA Champions League").
   "Seleções" não é uma liga: junta todo jogo de seleção (datas FIFA, Nations
   League, eliminatórias, Euro, Copa América, amistosos entre países), que o
   robô marca com sel=1. */
const LEAGUES = [
  ['Seleções',              e => !!e.sel],
  ['Brasileirão Série A',   /^brasileir[ãa]o(\s+s[ée]rie a)?$/i],
  ['Copa do Brasil',        /copa do brasil/i],
  ['Libertadores',          /libertadores/i],
  ['Sul-Americana',         /sul.?americana/i],
  ['Champions League',      /^(?!.*\b(afc|caf|ofc|concacaf)\b).*champions league|liga dos campe/i],
  ['Premier League',        /premier league|^(campeonato )?ingl[êe]s$/i],
  ['La Liga',               /la ?liga(?!\s*2)|^(campeonato )?espanhol$/i],
  ['Alemão (Bundesliga)',   /bundesliga|^(campeonato )?alem[ãa]o$/i],
  ['NBA',                   /\bnba\b/i],
  ['NFL',                   /\bnfl\b/i],
];
/* Categoria: base e divisões inferiores ocultas por padrão.
   (O robô usa a mesma noção de "base" em categoria(), no atualizar_dados.py.) */
const RE_SUB   = /sub.?\d{1,2}|\bu-?\d{2}\b|juvenil|j[úu]nior|aspirantes|\bbase\b|\bcopinha\b/i;
const RE_LOWER = /s[ée]rie [bcd]\b|s[ée]rie a[23]\b|[2-9][ªº°]? ?divis|(segunda|terceira|quarta) divis|\bchampionship\b|league (one|two)\b|2\. ?bundesliga|la ?liga 2|ligue 2|liga 2\b/i;
const RE_RESERVA = /\s(B|II)(\s+x\s|\s*$)/;   /* times B: "Ceará B x ...", "... x Bayern II" */
function isSub(e){ return RE_SUB.test(e.match + ' ' + e.league + ' ' + (e.detail||'')); }
function isLower(e){ return e.sport === 'Futebol' && (RE_LOWER.test(e.league + ' ' + (e.detail||'')) || RE_RESERVA.test(e.match)); }

  ['Botafogo',         /botafogo/i],
  ['Fluminense',       /fluminense/i],
  ['Real Madrid',      /real madrid/i],
  ['Barcelona',        /barcelona/i],
  ['Bayern',           /bayern/i],
  ['Manchester City',  /manchester city|man\.? city/i],
  ['Liverpool',        /liverpool/i],
  ['Chelsea',          /chelsea/i],
  ['Arsenal',          /arsenal/i],
  ['PSG',              /\bpsg\b|paris saint.?germain/i],
  ['Atlético Madrid',  /atl[ée]tico (de )?madrid/i],
];
function teamMatch(e){
  if(!state.team.size) return true;
  for(const [lbl,re] of TEAMS)
    if(state.team.has(lbl) && re.test(e.match)) return true;
  return false;
}
function leagueMatch(e){
  if(!state.league.size) return true;
  for(const [lbl,regra] of LEAGUES)
    if(state.league.has(lbl) && (typeof regra==='function' ? regra(e) : regra.test(e.league))) return true;
  return false;
}
function buildLeagueChips(){
  buildChips('league','chips-league', LEAGUES.map(l=>l[0]));
  buildChips('team','chips-team', TEAMS.map(t=>t[0]));
}
function buildAllChips(){
  const extras = uniq(DB.map(e=>e.sport)).filter(s=>!SPORTS.includes(s));
  buildChips('sport','chips-sport',[...SPORTS, ...extras]);
  const COUNTRIES = ['Brasil','América do Sul','EUA/Canadá','Inglaterra','Espanha','Alemanha','Itália','Europa (demais)','Mundial'];
  buildChips('country','chips-country',COUNTRIES);
  buildLeagueChips();
}

/* ---------- render ---------- */
function isLive(ev){
  if(ev.date!==DAYS[0].iso || state.day!==0) return false;
  const now = new Date();
  const [h,m] = ev.t.split(':').map(Number);
  const start = h*60+m, cur = now.getHours()*60+now.getMinutes();
  return cur>=start && cur<=start+135; /* ~2h15 de duração */
}
function block(t){
  const h = +t.split(':')[0];
  return h<12 ? 'Manhã' : h<18 ? 'Tarde' : 'Noite';
}
/* dedup defensivo: colapsa cards do mesmo jogo (mesma data+hora, nomes
   sobrepostos), preferindo o que tem canais reais e título mais limpo.
   Roda uma vez por carga de dados, não a cada render. */
let LIMPOS = [];
function prepararDB(){
  function chave(e){ return e.date+'|'+e.t; }
  const limpos = [];
  for(const e of DB){
    const dup = limpos.find(x=> chave(x)===chave(e) && x.sport===e.sport && x.g===e.g && isSub(x)===isSub(e) && (()=>{
      const a=(x.match||'').toLowerCase(), b=(e.match||'').toLowerCase();
      const ta=a.split(/\s+x\s+/), tb=b.split(/\s+x\s+/);
      if(ta.length!==2||tb.length!==2) return a.includes(b)||b.includes(a);
      const tem=(txt,t)=>{ const n=t.replace(/[^a-zà-ú ]/gi,'').trim(); return n.length>=3 && txt.includes(n); };
      return (tem(a,tb[0])&&tem(a,tb[1])) || (tem(b,ta[0])&&tem(b,ta[1]));
    })());
    if(dup){
      const score = ev => (ev.ch.some(c=>!/confirmar/i.test(c.n))?2:0) - (ev.match.length>40?1:0);
      if(score(e) > score(dup)) limpos[limpos.indexOf(dup)] = e;
    } else limpos.push(e);
  }
  LIMPOS = limpos;
}
/* quiet=true: atualização automática (placar) — redesenha sem re-animar os cards */
function render(quiet){
  const q = state.q.trim().toLowerCase();
  el('results').classList.toggle('quiet', quiet===true);
  let list = LIMPOS.filter(e=> e.date===DAYS[state.day].iso
    && (!state.sport.size   || state.sport.has(e.sport))
    && (!state.gender       || e.g===state.gender)
    && (!state.country.size || state.country.has(e.country))
    && leagueMatch(e)
    && teamMatch(e)
    && (state.catSub || !isSub(e))
    && (state.catLower || !isLower(e))
    && (!q || [e.match,e.league,e.sport,...e.ch.map(c=>c.n)].join(' ').toLowerCase().includes(q))
  ).sort((a,b)=>a.t.localeCompare(b.t));

  el('meta').innerHTML = `<b>${list.length}</b> evento(s) — ${DAYS[state.day].label}, ${DAYS[state.day].sub}` + (DATA_AT ? ` · dados de ${esc(DATA_AT)}` : '');

  if(!list.length){
    const ultimaData = DB.reduce((m,e)=> e.date>m ? e.date : m, '');
    const semConfirmacao = DAYS[state.day].iso > ultimaData;
    el('results').innerHTML = semConfirmacao
      ? `<div class="empty"><b>Programação ainda não confirmada para este dia.</b>As emissoras confirmam canais de futebol ~48h antes; NBA, NFL e as tabelas oficiais entram com até 7 dias. Volte mais perto da data — a atualização é automática.</div>`
      : `<div class="empty"><b>Nenhum evento com esses filtros.</b>Ajuste os filtros acima ou toque em “Limpar tudo”.</div>`;
    return;
  }
  let html='', lastBlock='';
  for(const e of list){
    const b = block(e.t);
    if(b!==lastBlock){ html += `<div class="timeblock">${b}</div>`; lastBlock=b; }
    const live = isLive(e);
    html += `
    <div class="card">
      <div class="when">
        <div class="time">${esc(e.t)}</div>
        ${(()=>{ const sc = scoreFor(e);
          if(sc) return `<div class="score">${esc(sc.a)}<span> x </span>${esc(sc.b)}</div><span class="score-status ${sc.fim?'fim':''}">${esc(sc.label)}</span>`;
          return live ? '<span class="live-pill"><i></i>AO VIVO</span>' : '';
        })()}
        <span class="gender-tag">${e.g==='F'?'FEMININO':'MASCULINO'}</span>
      </div>
      <div>
        <div class="ev-top">
          <span class="sport-tag">${esc(e.sport)}</span>
          <span class="matchup">${esc(e.match)}</span>
        </div>
        <div class="league">${esc(e.league)}${e.detail && e.detail!=='—' ? ` <em>(${esc(e.detail)})</em>` : ''}${e.v>=2?' <span class="verified" title="Confirmado em 2 fontes">✓✓</span>':''}</div>
        <div class="badges">
          ${e.ch.map(c=> /confirmar/i.test(c.n)
            ? `<span class="badge tbd">${esc(c.n)}</span>`
            : `<a class="badge ${['tv','stream','free'].includes(c.y)?c.y:'tv'}" href="${esc(linkDoCanal(c))}" target="_blank" rel="noopener"><i></i>${esc(c.n)}</a>`).join('')}
        </div>
      </div>
    </div>`;
  }
  el('results').innerHTML = html;
}

/* ---------- init ---------- */
el('seg-gender').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  state.gender = b.dataset.v;
  document.querySelectorAll('#seg-gender button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});
el('search').addEventListener('input', ev=>{ state.q = ev.target.value; render(); });

/* Botão "Atualizar": busca os dados de novo (não só redesenha) */
async function atualizar(){
  const b = el('btn-update'); b.disabled = true; b.textContent = 'Atualizando…';
  await tryLoadJson(); await fetchScores();
  b.disabled = false; b.textContent = 'Atualizar';
}
/* App instalado na tela de início fica dias em segundo plano: ao voltar (e a
   cada minuto, se aberto), confere se o dia virou e se os dados envelheceram. */
function sincronizar(){
  if(document.visibilityState!=='visible') return;
  if(DAYS[0].iso !== isoLocal(new Date())){            /* virou o dia: "Hoje" volta a ser hoje */
    customIso = null; DAYS = makeDays(); state.day = 0; buildDayTabs(); render();
  }
  if(Date.now() - lastTry > 10*60*1000) tryLoadJson();    /* dados com mais de 10 min */
  fetchScores();
}
document.addEventListener('visibilitychange', sincronizar);
window.addEventListener('pageshow', ev=>{ if(ev.persisted) sincronizar(); });

prepararDB(); buildDayTabs(); buildAllChips(); updateCounts(); render();
tryLoadJson();
fetchScores();
setInterval(sincronizar, 60000); /* placares, status AO VIVO, virada do dia e dados novos */
</script>
